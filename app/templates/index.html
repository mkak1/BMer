<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BMer keeps your saved links organized and easy to revisit." />
    <title>BMer | Your saved links</title>
    <link rel="stylesheet" href="{{ url_for('stylesheet', v=12) }}" />
    <script src="{{ url_for('static', filename='js/app.js', v=12) }}" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-wrap" href="/" aria-label="BMer home">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-copy">
            <span class="eyebrow">Your personal library</span>
            <span class="brand-name">BMer</span>
          </span>
        </a>
        <div class="topbar-actions">
          <label class="search-field">
            <span class="sr-only">Search bookmarks</span>
            <input id="searchInput" type="search" placeholder="Search your library" autocomplete="off" />
          </label>
        </div>
      </header>

      <main class="content">
        <section class="library-heading" aria-label="Bookmark collections">
          <div><span class="eyebrow">Your collection</span><h1>Browse by category</h1></div>
          <p id="resultSummary" aria-live="polite"></p>
        </section>
        <section id="categoryBoard" class="category-board" aria-live="polite" aria-busy="true"></section>
        <p id="errorMessage" class="error-message" role="alert" hidden></p>
      </main>
    </div>

    <div id="bookmarkModal" class="modal" aria-hidden="true" hidden>
      <button class="modal-backdrop" type="button" data-close="true" aria-label="Close dialog"></button>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div><span class="eyebrow">Your library</span><h2 id="modalTitle">Add bookmark</h2></div>
          <button id="closeModalBtn" class="close-button" type="button" aria-label="Close dialog">×</button>
        </div>
        <form id="bookmarkForm" class="bookmark-form">
          <label><span>Bookmark name</span><input id="bookmarkTitle" name="title" type="text" maxlength="80" placeholder="e.g. Figma" required /></label>
          <label><span>URL</span><input id="bookmarkUrl" name="url" type="url" placeholder="https://example.com" required /></label>
          <label><span>Category</span><select id="bookmarkCategory" name="categoryId" required></select></label>
          <label class="new-category-row"><span>New category</span><span class="category-input-wrap"><input id="newCategoryInput" type="text" maxlength="40" placeholder="Name a collection" /><button id="addCategoryBtn" class="small-button" type="button">Create</button></span></label>
          <div class="form-actions"><button id="cancelBtn" class="secondary-button" type="button">Cancel</button><button id="submitBookmarkBtn" class="primary-button" type="submit">Add bookmark</button></div>
        </form>
      </section>
    </div>
    <div id="categoryModal" class="modal" aria-hidden="true" hidden>
      <button class="modal-backdrop" type="button" data-close="true" aria-label="Close dialog"></button>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
        <div class="modal-header">
          <div><span class="eyebrow">Your library</span><h2 id="categoryModalTitle">Add category</h2></div>
          <button id="closeCategoryModalBtn" class="close-button" type="button" aria-label="Close dialog">×</button>
        </div>
        <form id="categoryForm" class="bookmark-form">
          <label><span>Category name</span><input id="categoryNameInput" name="categoryName" type="text" maxlength="40" placeholder="e.g. Research" required /></label>
          <div class="form-actions"><button id="cancelCategoryBtn" class="secondary-button" type="button">Cancel</button><button id="submitCategoryBtn" class="primary-button" type="submit">Create category</button></div>
        </form>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
